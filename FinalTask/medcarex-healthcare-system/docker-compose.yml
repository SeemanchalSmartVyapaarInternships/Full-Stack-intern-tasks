services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: medcarex
      MYSQL_ROOT_PASSWORD: medcarex_root_password
    ports:
      - "3306:3306"
    volumes:
      - medcarex_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmedcarex_root_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      CLIENT_URL: http://localhost:3000
      JWT_SECRET: replace_with_a_long_random_secret
      JWT_EXPIRES_IN: 1d
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: medcarex
      DB_USER: root
      DB_PASSWORD: medcarex_root_password
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  medcarex_mysql:
