name: MedCareX CI

on:
  push:
    branches: [feature/medcarex-healthcare-system]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix backend ci && npm --prefix backend test
      - run: npm --prefix frontend ci && npm --prefix frontend run lint && npm --prefix frontend run build
